<!doctype html>
<html lang="en" data-page="inch">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yingcun · Inch Converter</title>
<meta name="description" content="Snap an inspection sheet. Sizes, tolerances and control limits flip between inches and millimeters, written in red right on the photo. Runs on your phone; the photo never leaves it.">
<script src="../strings.js?v=0.5.0"></script>
<meta name="theme-color" content="#0e141c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<style>
/* 和工时榨汁机同一套深色工单皮肤；整页就一条竖栏：方向 → 拍照 → 结果图。 */
:root {
  --bg: #0e141c;
  --surface: #172030;
  --surface-2: #1c2738;
  --ink: #e5eaf1;
  --muted: #9aa7b8;
  --faint: #5c6a7d;
  --line: #273347;
  --field-line: #3a4a60;
  --accent: #86aee6;
  --on-accent: #0e141c;
  --band: #1f3556;
  --ok: #6fd3a0;
  --flag: #ffd60a;
  --warn: #f08a5d;
  --focus: #86aee6;
  --font-num: "Barlow Condensed", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-ui: "Barlow", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html[lang="en"] {
  --font-ui: "Barlow", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", Roboto, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 32px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }   /* 列宽钉死：宽结果图自己往两边伸，不把整条竖栏撑宽 */
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { -webkit-tap-highlight-color: transparent; }

.top { display: flex; align-items: center; gap: 8px; }
.top .tabs { flex: 1; min-width: 0; }
/* 三个工具：窄屏上 EN/中文 单占一行靠右，三个标签整行平分 */
@media (max-width: 719px) { .top { flex-wrap: wrap; } .top .tabs { order: 2; flex-basis: 100%; } .top .lang { margin-left: auto; } .tabs a { font-size: 13.5px; } }
.tabs {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 3px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
}
.tabs a {
  height: 34px; display: flex; align-items: center; justify-content: center;
  border-radius: 8px; color: var(--muted); font-size: 14px; font-weight: 700; text-decoration: none;
}
.tabs a[aria-current="page"] { background: var(--band); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
.tabs a:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
/* EN / 中文：跟工具切换同一套样子，实底不透（底下有藤蔓）；点的范围上下各撑 5px 到 44 高；宽屏挪到页面右上角 */
.lang {
  flex: none; display: flex; gap: 2px; padding: 3px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
}
.lang button {
  position: relative; min-width: 44px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap;
}
.lang button::after { content: ""; position: absolute; left: 0; right: 0; top: -5px; bottom: -5px; }
.lang button[aria-pressed="true"] { background: var(--band); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.35); }
.lang button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
@media (min-width: 720px) {
  .lang { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
}

.status p { align-items: flex-start; }
.unit button, .sug button, .retry { line-height: 1.15; height: auto; min-height: 36px; padding-block: 5px; }
.head { text-align: center; }
.head h1 { margin: 2px 0 0; font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: .06em; }
html[lang="en"] .head h1 { font-size: 28px; letter-spacing: -.02em; }
.sub { margin: 6px 0 0; font-size: 15px; line-height: 1.6; color: var(--muted); }
/* 照妖镜周围的藤蔓会爬到这些东西底下：它们得站在藤蔓上面 */
.tabs, .lang, .head, .seg, .hint, .album, .status, .result, .foot { position: relative; z-index: 2; }
@media (min-width: 720px) { .lang { position: absolute; } }   /* 上面那条把它改回 relative 了，宽屏再挪回右上角 */

.seg {
  position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
}
.seg::before {
  content: ""; position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px);
  border-radius: 10px; background: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.35);
  transition: transform .24s cubic-bezier(.3,.7,.2,1);
}
.seg[data-mode="mm2in"]::before { transform: translateX(100%); }
.seg button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; line-height: 1.15;
  position: relative; z-index: 1; height: 52px; padding: 0 6px; border: 0; background: transparent;
  color: var(--muted); font-size: 16px; font-weight: 700; letter-spacing: .01em; transition: color .2s;
}
.seg button[aria-checked="true"] { color: var(--on-accent); }
.seg button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 10px; }

/* ---------------------------------------------------------------- 照妖镜：镜面就是快门 */
html, body { overflow-x: hidden; overflow-x: clip; }
.hero {
  --D: min(68vw, 300px);
  position: relative; z-index: 1; width: 100vw; margin-left: calc(50% - 50vw);
  height: calc(var(--D) + 56px); display: grid; place-items: center;
}
.stage { position: absolute; left: 0; right: 0; top: calc(50% - var(--D)); height: calc(var(--D) * 2); overflow: hidden; pointer-events: none; }
.stage.front { z-index: 3; }
.vines, .spores, .hero::before {
  position: absolute; left: 50%; top: 50%; width: calc(var(--D) * 2); height: calc(var(--D) * 2);
  transform: translate(-50%, -50%); pointer-events: none;
}
.hero::before {                              /* 镜光：镜子背后那一团晕 */
  content: ""; width: calc(var(--D) * 1.4); height: calc(var(--D) * 1.4); border-radius: 50%;
  background: radial-gradient(closest-side, hsla(214, 90%, 66%, .42) 50%, hsla(214, 80%, 58%, .12) 72%, hsla(214, 70%, 50%, 0) 100%);
}
.vines svg { display: block; width: 100%; height: 100%; overflow: visible; }
/* 藤蔓四周慢慢化进黑里；镜子下面那截收得早，别爬进底下的字里 */
.vines.back {
  -webkit-mask-image: radial-gradient(closest-side at 50% 44%, #000 54%, rgba(0,0,0,.5) 74%, transparent 92%);
  mask-image: radial-gradient(closest-side at 50% 44%, #000 54%, rgba(0,0,0,.5) 74%, transparent 92%);
}
.vines.front {
  z-index: 3;
  -webkit-mask-image: radial-gradient(closest-side at 50% 44%, #000 60%, transparent 88%);
  mask-image: radial-gradient(closest-side at 50% 44%, #000 60%, transparent 88%);
}
/* 打开时藤蔓从镜子里长出来：整层放大 + 渐显（Safari 不吃 SVG 遮罩动画，改用 CSS） */
.hero .vines { animation: bloom 2.2s cubic-bezier(.2,.7,.2,1) both; }
@keyframes bloom { from { opacity: 0; transform: translate(-50%, -50%) scale(.62); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.vines .pulse { fill: none; stroke: hsl(214, 100%, 90%); stroke-width: 1.6; stroke-linecap: round; opacity: 0; }
.vines .tw { animation: twinkle 3.6s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
.spore {
  position: absolute; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; border-radius: 50%;
  background: hsl(214, 100%, 88%); box-shadow: 0 0 6px 1px hsla(214, 100%, 72%, .85);
  opacity: 0; animation: drift-a 8s ease-in-out infinite; will-change: transform, opacity;
}
.spore:nth-child(3n+1) { animation-name: drift-b; }
.spore:nth-child(3n+2) { animation-name: drift-c; width: 2px; height: 2px; }
@keyframes drift-a { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 25% { opacity: .95; } 75% { opacity: .5; } 100% { transform: translate(14px, -46px) scale(1); opacity: 0; } }
@keyframes drift-b { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 30% { opacity: .8; } 70% { opacity: .6; } 100% { transform: translate(-18px, -38px) scale(1.1); opacity: 0; } }
@keyframes drift-c { 0% { transform: translate(0, 0); opacity: 0; } 35% { opacity: 1; } 65% { opacity: .7; } 100% { transform: translate(6px, -58px); opacity: 0; } }

.mirror {
  position: relative; z-index: 2; width: var(--D); height: var(--D); padding: 0; border: 0; border-radius: 50%;
  background: none; color: #0b1626; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  transition: transform .18s cubic-bezier(.3,.7,.2,1);
}
.mirror svg.layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.mirror .spin { will-change: transform; }
.mirror:active { transform: scale(.975); }
.mirror:disabled { cursor: progress; }
.mirror:focus-visible { outline: none; }
.mirror:focus-visible .face { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--focus), inset 0 0 0 1.5px rgba(255,255,255,.4); }
.face {
  position: absolute; left: 50%; top: 50%; width: 62.86%; height: 62.86%; transform: translate(-50%, -50%);
  border-radius: 50%; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  background:
    radial-gradient(70% 55% at 34% 24%, rgba(255,255,255,.62) 0%, rgba(255,255,255,0) 60%),
    radial-gradient(circle at 50% 46%, hsl(214, 78%, 84%) 0%, hsl(214, 70%, 74%) 42%, hsl(215, 58%, 62%) 76%, hsl(216, 52%, 50%) 100%);
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4), inset 0 -14px 26px hsla(216, 60%, 28%, .45), 0 0 46px hsla(214, 95%, 66%, .45);
  transition: filter .3s ease;
}
.face::after {                               /* 识别时镜面里转的那道光 */
  content: ""; position: absolute; inset: 0; border-radius: 50%; opacity: 0; pointer-events: none;
  background: conic-gradient(from 0deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,0) 250deg, rgba(255,255,255,.75) 345deg, rgba(255,255,255,0) 360deg);
  transition: opacity .3s ease;
}
.face svg { width: 36px; height: 36px; opacity: .88; }
.face-label { font-size: 18px; font-weight: 700; letter-spacing: .12em; line-height: 1; margin-left: .12em; }
html[lang="en"] .face-label { letter-spacing: .02em; margin-left: 0; }
.hero.working .face::after { opacity: .9; animation: sweep 1.1s linear infinite; }
.hero.working .face { filter: brightness(1.06); }
.hero.working .vines .tw, .hero.working .spore { animation-play-state: paused; }
@keyframes sweep { to { transform: rotate(360deg); } }
.mirror::after {                             /* 一按：一圈照妖光往外炸 */
  content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; opacity: 0;
  box-shadow: 0 0 0 2px hsla(214, 100%, 82%, .9), 0 0 30px 6px hsla(214, 100%, 70%, .55);
}
.hero.flash .mirror::after { animation: burst .85s cubic-bezier(.2,.7,.3,1) both; }
@keyframes burst { 0% { opacity: .95; transform: scale(.62); } 100% { opacity: 0; transform: scale(1.75); } }
@media (prefers-reduced-motion: reduce) {
  .hero .vines { animation: none; }
  .vines .tw, .spore, .hero.working .face::after { animation: none; }
  .spore { display: none; }
}

.hint { margin: 0; text-align: center; font-size: 13.5px; line-height: 1.55; color: var(--muted); }
.hint b { display: block; margin-bottom: 2px; font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: .04em; }
.album {
  justify-self: center; width: min(100%, 300px); height: 52px; border-radius: 26px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  border: 1px solid var(--field-line); background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 700;
  transition: transform .12s ease, opacity .2s;
}
.album svg { width: 22px; height: 22px; flex: none; }
.album:active { transform: scale(.97); }
.album:disabled { opacity: .45; }
.album:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.btn {
  height: 58px; padding: 0 22px; border: 0; border-radius: 15px;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  font-size: 17px; font-weight: 700; color: var(--ink); background: transparent;
  transition: transform .12s ease, opacity .2s;
}
.btn svg { width: 22px; height: 22px; flex: none; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { border: 1px solid var(--field-line); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.pick { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.hint { margin: -2px 2px 0; font-size: 13.5px; line-height: 1.5; color: var(--muted); }

.status {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px 14px;
}
.status p { margin: 0; font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
.status .pct { font-family: var(--font-num); font-size: 17px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.bar { height: 4px; margin-top: 10px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--accent); transition: width .3s ease; }
.status.bad { border-color: var(--warn); }
.status.bad .bar { display: none; }
.status .retry { margin-top: 10px; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--field-line); background: transparent; color: var(--ink); font-weight: 700; }

.result { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.sum { display: flex; align-items: flex-start; gap: 9px; margin: 0; font-size: 15px; font-weight: 700; line-height: 1.45; }
.sum::before { content: ""; flex: none; width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; background: var(--ok); }
.sum.flag::before { background: var(--flag); }
.sum.none::before { background: var(--warn); }
.unit { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 12px 11px 14px; line-height: 1.4;
  background: rgba(240,138,93,.12); border: 1px solid rgba(240,138,93,.45); border-radius: 10px; font-size: 14px; }
.unit button { flex: none; height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: var(--warn); color: var(--on-accent); font-weight: 700; }
/* 结果图不受 440 那条竖栏管：手机横过来就铺满整个屏宽，字跟着变大 */
.pic { --w: min(calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)), 1100px);
  position: relative; width: var(--w); margin-left: calc((100% - var(--w)) / 2);
  border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #fff; }
.pic img { display: block; width: 100%; height: auto; -webkit-touch-callout: default; }
.turn { margin: -2px 2px 0; font-size: 13px; color: var(--muted); text-align: center; }
@media (orientation: landscape) { .turn { display: none; } }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.acts .btn { height: 52px; font-size: 16px; }
.foot { margin: 0; padding-inline: 2px; font-size: 12.5px; color: var(--muted); text-align: center; }

/* 改数：底部弹出的小单子 */
.veil { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(4,8,14,.55); animation: fade .18s ease; overscroll-behavior: contain; touch-action: none; }
.veil .sheet { touch-action: manipulation; }
.sheet { width: min(100%, 480px); padding: 8px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--surface-2); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0;
  box-shadow: 0 -12px 40px rgba(0,0,0,.45); animation: rise .26s cubic-bezier(.2,.8,.2,1); }
.grab { width: 38px; height: 5px; margin: 0 auto 12px; border-radius: 3px; background: var(--field-line); }
.sheet h2 { margin: 0; font-size: 18px; font-weight: 700; }
.meta { margin: 2px 0 12px; font-size: 13.5px; color: var(--muted); }
.field { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; }
.sign, .num {
  height: 58px; border-radius: 12px; border: 1px solid var(--field-line); background: var(--surface); color: var(--ink);
}
.sign { font-family: var(--font-num); font-size: 26px; font-weight: 700; }
.num { width: 100%; min-width: 0; padding: 0 14px; font-family: var(--font-num); font-size: 34px; font-weight: 700;
  letter-spacing: .02em; font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none; }
.num:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.num[aria-invalid="true"] { border-color: var(--warn); outline-color: var(--warn); }
.prev { margin: 10px 2px 0; font-size: 15px; color: var(--muted); }
.prev b { color: #ff6b6b; font-family: var(--font-num); font-size: 22px; font-weight: 700; margin-right: 4px; font-variant-numeric: tabular-nums; }
.sug { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding: 10px 12px;
  border-radius: 12px; background: rgba(255,214,10,.1); border: 1px solid rgba(255,214,10,.4); font-size: 14px; }
.sug b { font-family: var(--font-num); font-size: 20px; color: var(--flag); margin-left: 4px; font-variant-numeric: tabular-nums; }
.sug button { flex: none; height: 36px; padding: 0 14px; border: 0; border-radius: 10px; background: var(--flag); color: #1a1500; font-weight: 700; }
.sheet .acts { margin-top: 16px; }
@keyframes rise { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .seg::before, .bar i { transition: none; } .veil, .sheet { animation: none; } }
</style>
<script src="ort/ort.wasm.min.js"></script>

<body>
<main class="wrap">
  <div class="top">
    <nav class="tabs" data-i18n-attr="aria-label:common.tabsLabel">
      <a href="../" data-i18n="common.tabCo"></a>
      <a href="./" aria-current="page" data-i18n="common.tabInch"></a>
      <a href="../count/" data-i18n="common.tabCount"></a>
    </nav>
    <div class="lang" role="group" data-i18n-attr="aria-label:common.langLabel">
      <button type="button" data-l="en" lang="en">EN</button>
      <button type="button" data-l="zh" lang="zh-CN">中文</button>
    </div>
  </div>

  <header class="head">
    <h1 data-i18n="inch.h1"></h1>
    <p class="sub" data-i18n-html="inch.sub"></p>
  </header>

  <div class="seg" id="seg" role="radiogroup" data-i18n-attr="aria-label:inch.segLabel">
    <button type="button" role="radio" data-mode="in2mm" data-i18n="inch.in2mm"></button>
    <button type="button" role="radio" data-mode="mm2in" data-i18n="inch.mm2in"></button>
  </div>

  <section class="hero" id="hero">
    <div class="stage" aria-hidden="true">
      <div class="vines back" id="vines-back"></div>
      <div class="spores" id="spores"></div>
    </div>
    <button class="mirror" id="shoot" type="button" data-i18n-attr="aria-label:inch.shootLabel">
      <svg class="layer spin" id="mirror-spin" viewBox="-140 -140 280 280" aria-hidden="true"></svg>
      <svg class="layer" id="mirror-rim" viewBox="-140 -140 280 280" aria-hidden="true"></svg>
      <span class="face">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.3-2h7l1.3 2h1.7A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>
        <span class="face-label" id="face-label"></span>
      </span>
    </button>

<script>
/* ============================================================================
   英寸照妖镜 —— 拍检查表，DIMENSION / LSL / USL 三列在原图上落红字换算值。
   识字全在手机本地跑（PaddleOCR PP-OCRv4 + onnxruntime-web），照片不出手机。
   ============================================================================ */
const MIRROR = (() => {
  'use strict';
  const BASE = new URL('./', location.href).href;
  const FILES = {
    glue: 'ort/ort-wasm-simd-threaded.js',
    wasm: ['ort/ort-wasm-simd-threaded.wasm', 14848852],
    det: ['models/det.onnx', 4745517],
    rec: ['models/rec.onnx', 10857958],
    cls: ['models/cls.onnx', 585532],
    keys: 'models/keys.txt'
  };
  const CACHE = 'inch-mirror-assets-v1';
  const T = { WORK: 2016, DET_ORIENT: 640, DET_MAIN: 1024, REC_H: 48, REC_MINW: 96, REC_BATCH: 8, ORIENT_N: 8, MAX_RATIO: 8.5 };

  // ------------------------------------------------------------------ 小工具
  const median = a => { if (!a.length) return NaN; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  function fit(xs, ys) {                       // 最小二乘 y = s·x + a，返回 [s, a]
    const mx = mean(xs), my = mean(ys); let sxx = 0, sxy = 0;
    for (let i = 0; i < xs.length; i++) { sxx += (xs[i] - mx) ** 2; sxy += (xs[i] - mx) * (ys[i] - my); }
    const s = sxx > 1e-9 ? sxy / sxx : 0;
    return [s, my - s * mx];
  }
  function lev(a, b) {
    const d = []; for (let j = 0; j <= b.length; j++) d[j] = j;
    for (let i = 1; i <= a.length; i++) {
      let p = d[0]; d[0] = i;
      for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] !== b[j - 1])); p = t; }
    }
    return d[b.length];
  }
  const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  const ctx2d = c => c.getContext('2d', { willReadFrequently: true });
  const nextFrame = () => new Promise(r => setTimeout(r, 0));

  // ------------------------------------------------------------------ 数字：认、算
  // 解析成有理数 n/d（d = 10^小数位，或分数的分母），换算全程整数运算，不吃浮点误差。
  function parseNum(text) {
    let s = String(text == null ? '' : text).trim().replace(/\s+/g, ' ');
    const digits = (s.match(/\d/g) || []).length;
    if (!digits) return null;
    s = s.replace(/[—–一－_~]/g, '-').replace(/[，,。]/g, '.');
    if (digits >= 2) s = s.replace(/[OoDQ]/g, '0').replace(/[lI|]/g, '1');
    let m = s.match(/^([+-]?)(?:(\d+)[- ])?(\d+)\/(\d+)$/);   // 3/8、1-1/4
    if (m) {
      const w = m[2] ? +m[2] : 0, a = +m[3], b = +m[4];
      if ([2, 4, 8, 16, 32, 64].indexOf(b) < 0 || a <= 0 || a >= b) return null;
      return { s: (m[1] || '') + (m[2] ? m[2] + '-' : '') + a + '/' + b, n: (w * b + a) * (m[1] === '-' ? -1 : 1), d: b, dec: 6, plus: m[1] === '+' };
    }
    s = s.replace(/ /g, '');
    m = s.match(/^([+-]?)(\d*)(?:\.(\d*))?$/);
    if (!m || (!m[2] && !m[3])) return null;
    const fp = (m[3] || '').slice(0, 6), d = Math.pow(10, fp.length);
    const n = (parseInt(m[2] || '0', 10) * d + (fp ? parseInt(fp, 10) : 0)) * (m[1] === '-' ? -1 : 1);
    return { s, n, d, dec: fp.length, plus: m[1] === '+' };
  }
  function roundDiv(n, d) {
    const neg = (n < 0) !== (d < 0); n = Math.abs(n); d = Math.abs(d);
    let q = Math.floor(n / d); if (2 * (n - q * d) >= d) q++;
    return neg ? -q : q;
  }
  // 1 英寸 = 25.4 毫米（1959 年定死的精确值）。毫米留 3 位，英寸留 4 位。
  function convert(p, mode) {
    const out = mode === 'in2mm' ? roundDiv(p.n * 25400, p.d) : roundDiv(p.n * 100000, 254 * p.d);
    const dec = mode === 'in2mm' ? 3 : 4, P = Math.pow(10, dec), a = Math.abs(out);
    return (out < 0 ? '-' : p.plus && a ? '+' : '') + Math.floor(a / P) + '.' + String(a % P).padStart(dec, '0');
  }
  const micro = p => roundDiv(p.n * 1000000, p.d);
  function fmtMicro(m, dec) {
    const a = Math.abs(m), s = String(a % 1000000).padStart(6, '0').slice(0, Math.max(1, dec));
    return (m < 0 ? '-' : '') + Math.floor(a / 1000000) + '.' + s;
  }

  // ------------------------------------------------------------------ 识字引擎
  let det = null, rec = null, cls = null, chars = null, loading = null;
  const prof = { det: 0, detPx: 0, rec: 0, recN: 0, recW: 0, helperBatches: 0 };
  async function fetchAsset(path, onBytes) {
    const url = BASE + path;
    let cache = null;
    try { cache = await caches.open(CACHE); } catch (e) {}
    if (cache) {
      const hit = await cache.match(url);
      if (hit) { const b = await hit.arrayBuffer(); onBytes(b.byteLength); return b; }
    }
    const res = await fetch(url);
    if (!res.ok) throw new Error(path + ' ' + res.status);
    let buf;
    if (res.body && res.body.getReader) {
      const rd = res.body.getReader(), parts = []; let got = 0;
      for (;;) { const r = await rd.read(); if (r.done) break; parts.push(r.value); got += r.value.length; onBytes(r.value.length); }
      const u = new Uint8Array(got); let o = 0; for (const p of parts) { u.set(p, o); o += p.length; }
      buf = u.buffer;
    } else { buf = await res.arrayBuffer(); onBytes(buf.byteLength); }
    if (cache) { try { await cache.put(url, new Response(buf.slice(0), { headers: { 'Content-Type': 'application/octet-stream' } })); } catch (e) {} }
    return buf;
  }
  function load(onProgress) {
    if (loading) return loading;
    loading = (async () => {
      if (typeof ort === 'undefined') throw new Error('ort.wasm.min.js 没加载');
      const total = FILES.wasm[1] + FILES.det[1] + FILES.rec[1] + FILES.cls[1];
      let got = 0;
      const tick = n => { got += n; onProgress && onProgress(Math.min(0.99, got / total)); };
      const [wasm, d, r, cl, keys] = await Promise.all([
        fetchAsset(FILES.wasm[0], tick), fetchAsset(FILES.det[0], tick), fetchAsset(FILES.rec[0], tick), fetchAsset(FILES.cls[0], tick),
        fetch(BASE + FILES.keys).then(x => { if (!x.ok) throw new Error('keys ' + x.status); return x.text(); })
      ]);
      ort.env.wasm.wasmPaths = { mjs: BASE + FILES.glue, wasm: BASE + FILES.wasm[0] };
      ort.env.wasm.wasmBinary = wasm;
      ort.env.wasm.numThreads = 1;
      ort.env.wasm.proxy = false;
      const opt = { executionProviders: ['wasm'], graphOptimizationLevel: 'all' };
      det = await ort.InferenceSession.create(new Uint8Array(d), opt);
      rec = await ort.InferenceSession.create(new Uint8Array(r), opt);
      cls = await ort.InferenceSession.create(new Uint8Array(cl), opt);
      chars = [''].concat(keys.replace(/\r/g, '').split('\n'), [' ']);
      startHelper(wasm, r);
      onProgress && onProgress(1);
      return true;
    })();
    loading.catch(() => { loading = null; });
    return loading;
  }

  async function detect(src, maxSide) {
    const w = src.width, h = src.height, r = Math.min(1, maxSide / Math.max(w, h));
    const nw = Math.max(32, Math.round(w * r / 32) * 32), nh = Math.max(32, Math.round(h * r / 32) * 32);
    const c = mkCanvas(nw, nh), g = ctx2d(c);
    g.imageSmoothingQuality = 'high';
    g.drawImage(src, 0, 0, nw, nh);
    const px = g.getImageData(0, 0, nw, nh).data, N = nw * nh, x = new Float32Array(3 * N);
    for (let i = 0, j = 0; i < N; i++, j += 4) {      // 模型吃 BGR
      x[i] = (px[j + 2] / 255 - 0.485) / 0.229;
      x[N + i] = (px[j + 1] / 255 - 0.456) / 0.224;
      x[2 * N + i] = (px[j] / 255 - 0.406) / 0.225;
    }
    const feeds = {}; feeds[det.inputNames[0]] = new ort.Tensor('float32', x, [1, 3, nh, nw]);
    const t0 = performance.now();
    const out = await det.run(feeds);
    prof.det += performance.now() - t0; prof.detPx += nw * nh;
    return { prob: out[det.outputNames[0]].data, w: nw, h: nh, sx: w / nw, sy: h / nh };
  }

  // 概率图二值化后找连通块，顺手累计矩（算倾角）和平均概率（算可信度）
  function components(prob, w, h, thr) {
    const N = w * h, lab = new Int32Array(N), stack = new Int32Array(N), out = [];
    let n = 0;
    for (let i = 0; i < N; i++) {
      if (lab[i] || prob[i] <= thr) continue;
      n++; let sp = 0; stack[sp++] = i; lab[i] = n;
      let area = 0, sum = 0, x0 = w, y0 = h, x1 = -1, y1 = -1, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0;
      while (sp) {
        const p = stack[--sp], x = p % w, y = (p - x) / w;
        area++; sum += prob[p]; sx += x; sy += y; sxx += x * x; syy += y * y; sxy += x * y;
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (x > 0 && !lab[p - 1] && prob[p - 1] > thr) { lab[p - 1] = n; stack[sp++] = p - 1; }
        if (x < w - 1 && !lab[p + 1] && prob[p + 1] > thr) { lab[p + 1] = n; stack[sp++] = p + 1; }
        if (y > 0 && !lab[p - w] && prob[p - w] > thr) { lab[p - w] = n; stack[sp++] = p - w; }
        if (y < h - 1 && !lab[p + w] && prob[p + w] > thr) { lab[p + w] = n; stack[sp++] = p + w; }
      }
      out.push({ area, score: sum / area, x0, y0, x1, y1, sx, sy, sxx, syy, sxy });
    }
    return out;
  }

  // 帮手：后台再开一个识字的，两个一起认，手机两颗大核都用上（开不起来就主线程自己认）
  const HELPER_SRC = [
    'self.onmessage = async e => {',
    '  const m = e.data;',
    '  try {',
    '    if (m.type === "init") {',
    '      importScripts(m.ortUrl);',
    '      ort.env.wasm.wasmPaths = m.paths; ort.env.wasm.wasmBinary = m.wasm; ort.env.wasm.numThreads = 1; ort.env.wasm.proxy = false;',
    '      self.rec = await ort.InferenceSession.create(new Uint8Array(m.model), { executionProviders: ["wasm"], graphOptimizationLevel: "all" });',
    '      self.postMessage({ type: "ready" });',
    '    } else if (m.type === "run") {',
    '      const f = {}; f[self.rec.inputNames[0]] = new ort.Tensor("float32", m.x, m.dims);',
    '      const out = (await self.rec.run(f))[self.rec.outputNames[0]];',
    '      const N = out.dims[0], Tn = out.dims[1], C = out.dims[2], d = out.data, idx = new Int32Array(N * Tn), pr = new Float32Array(N * Tn);',
    '      for (let i = 0; i < N * Tn; i++) { const o = i * C; let b = 0, bv = d[o]; for (let c = 1; c < C; c++) if (d[o + c] > bv) { bv = d[o + c]; b = c; } idx[i] = b; pr[i] = bv; }',
    '      self.postMessage({ type: "done", id: m.id, idx, pr, Tn }, [idx.buffer, pr.buffer]);',
    '    }',
    '  } catch (err) { self.postMessage({ type: "error", id: m.id, msg: String(err && err.message || err) }); }',
    '};'
  ].join('\n');
  const helper = { w: null, ready: false, busy: false, seq: 0, wait: {} };
  function startHelper(wasm, model) {
    if (helper.w || typeof Worker === 'undefined') return;
    try {
      const w = new Worker(URL.createObjectURL(new Blob([HELPER_SRC], { type: 'text/javascript' })));
      helper.w = w;
      w.onmessage = e => {
        const m = e.data;
        if (m.type === 'ready') { helper.ready = true; return; }
        const cb = helper.wait[m.id]; delete helper.wait[m.id];
        if (m.type === 'error') { helper.ready = false; if (cb) cb.reject(new Error(m.msg)); return; }
        if (cb) cb.resolve(m);
      };
      w.onerror = () => { helper.ready = false; for (const k in helper.wait) helper.wait[k].reject(new Error('helper')); helper.wait = {}; };
      const wb = wasm.slice(0), mb = model.slice(0);
      w.postMessage({ type: 'init', ortUrl: BASE + 'ort/ort.wasm.min.js', paths: { mjs: BASE + FILES.glue, wasm: BASE + FILES.wasm[0] }, wasm: wb, model: mb }, [wb, mb]);
    } catch (e) { helper.w = null; }
  }
  function helperRun(x, dims) {
    return new Promise((resolve, reject) => {
      const id = ++helper.seq;
      helper.wait[id] = { resolve, reject };
      helper.w.postMessage({ type: 'run', id, x, dims }, [x.buffer]);
    });
  }
  async function mainRun(x, dims) {
    const f = {}; f[rec.inputNames[0]] = new ort.Tensor('float32', x, dims);
    const out = (await rec.run(f))[rec.outputNames[0]];
    const N = out.dims[0], Tn = out.dims[1], C = out.dims[2], d = out.data, idx = new Int32Array(N * Tn), pr = new Float32Array(N * Tn);
    for (let i = 0; i < N * Tn; i++) { const o = i * C; let b = 0, bv = d[o]; for (let c = 1; c < C; c++) if (d[o + c] > bv) { bv = d[o + c]; b = c; } idx[i] = b; pr[i] = bv; }
    return { idx, pr, Tn };
  }

  // crops: [{src, x, y, w, h}]，横排文字。返回 [{text, conf}]
  async function recognize(crops) {
    const n = crops.length, res = new Array(n), H = T.REC_H;
    if (!n) return res;
    const t0 = performance.now();
    const ratio = crops.map(c => c.w / c.h);
    const order = crops.map((_, i) => i).sort((a, b) => ratio[a] - ratio[b]);
    const tmp = mkCanvas(T.REC_MINW, H); let tg = ctx2d(tmp);
    const batches = [];
    for (let s = 0; s < n; s += T.REC_BATCH) batches.push(order.slice(s, s + T.REC_BATCH));
    const build = idx => {
      const W = Math.max(T.REC_MINW, Math.ceil(H * Math.max.apply(null, idx.map(i => ratio[i]))));
      const plane = H * W, x = new Float32Array(idx.length * 3 * plane);
      idx.forEach((i, k) => {
        const c = crops[i], rw = Math.min(W, Math.max(1, Math.ceil(H * ratio[i])));
        if (tmp.width < rw) { tmp.width = rw; tg = ctx2d(tmp); }
        tg.imageSmoothingQuality = 'high';
        tg.drawImage(c.src, c.x, c.y, c.w, c.h, 0, 0, rw, H);
        const px = tg.getImageData(0, 0, rw, H).data, base = k * 3 * plane;
        for (let yy = 0; yy < H; yy++) {
          for (let xx = 0; xx < rw; xx++) {
            const j = (yy * rw + xx) * 4, o = base + yy * W + xx;
            x[o] = px[j + 2] / 127.5 - 1;
            x[o + plane] = px[j + 1] / 127.5 - 1;
            x[o + 2 * plane] = px[j] / 127.5 - 1;
          }
        }
      });
      prof.recN += idx.length; prof.recW += idx.length * W;
      return { x, dims: [idx.length, 3, H, W] };
    };
    const decode = (idx, r) => idx.forEach((i, k) => {
      let text = '', sum = 0, cnt = 0, last = 0;
      for (let t = 0; t < r.Tn; t++) {
        const o = k * r.Tn + t, best = r.idx[o];
        if (best !== 0 && best !== last) { text += chars[best] || ''; sum += r.pr[o]; cnt++; }
        last = best;
      }
      res[i] = { text, conf: cnt ? sum / cnt : 0 };
    });
    // 活按工作量对半分：帮手那份一次性打包扔过去，主线程埋头干自己那份；帮手出错就收回来自己补
    const cost = idx => idx.length * Math.max(T.REC_MINW, Math.ceil(H * Math.max.apply(null, idx.map(i => ratio[i]))));
    const mine = [], theirs = [];
    if (helper.ready && batches.length > 1) {
      let a = 0, b = 0;
      batches.slice().sort((p, q) => cost(q) - cost(p)).forEach(idx => { if (a <= b) { mine.push(idx); a += cost(idx); } else { theirs.push(idx); b += cost(idx); } });
    } else mine.push.apply(mine, batches);
    const away = theirs.map(idx => { const b = build(idx); return helperRun(b.x, b.dims).then(r => { prof.helperBatches++; decode(idx, r); }, () => idx); });
    for (const idx of mine) { const b = build(idx); decode(idx, await mainRun(b.x, b.dims)); }
    for (const left of await Promise.all(away)) {
      if (left) { const b = build(left); decode(left, await mainRun(b.x, b.dims)); }
    }
    prof.rec += performance.now() - t0;
    return res;
  }

  // ------------------------------------------------------------------ 照片扶正
  function toCanvas(img, maxSide) {
    const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
    const s = Math.min(1, maxSide / Math.max(w0, h0));
    const c = mkCanvas(w0 * s, h0 * s), g = ctx2d(c);
    g.imageSmoothingQuality = 'high';
    g.drawImage(img, 0, 0, c.width, c.height);
    return c;
  }
  function rotateCanvas(src, deg) {           // 逆时针转 deg 度，画布撑大，空角补白
    const a = -deg * Math.PI / 180, cos = Math.abs(Math.cos(a)), sin = Math.abs(Math.sin(a));
    const w = src.width, h = src.height, nw = Math.round(h * sin + w * cos), nh = Math.round(h * cos + w * sin);
    const c = mkCanvas(nw, nh), g = ctx2d(c);
    g.fillStyle = '#fff'; g.fillRect(0, 0, nw, nh);
    g.imageSmoothingQuality = 'high';
    g.translate(nw / 2, nh / 2); g.rotate(a); g.translate(-w / 2, -h / 2);
    g.drawImage(src, 0, 0);
    return c;
  }
  function cropRot(src, cx, cy, L, Wd, deg) {
    const c = mkCanvas(Math.max(8, L), Math.max(8, Wd)), g = ctx2d(c);
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.translate(c.width / 2, c.height / 2); g.rotate(-deg * Math.PI / 180); g.translate(-cx, -cy);
    g.drawImage(src, 0, 0);
    return { src: c, x: 0, y: 0, w: c.width, h: c.height };
  }
  // 文字主轴方向 + 0/180 由识字可信度定。返回要逆时针转的角度。
  async function findOrientation(src) {
    const d = await detect(src, T.DET_ORIENT);
    const cand = [];

  // 扶正后的图：找字框 → 认字
  async function readAll(up) {
    const d = await detect(up, T.DET_MAIN), items = [];
    for (const c of components(d.prob, d.w, d.h, 0.3)) {
      const w = c.x1 - c.x0 + 1, h = c.y1 - c.y0 + 1;
      if (Math.min(w, h) < 3 || c.area < 6 || c.score < 0.6) continue;
      const g = w * h * 1.6 / (2 * (w + h));          // DB 的 unclip，把缩进去的字框撑回来
      const x0 = Math.max(0, Math.floor((c.x0 - g) * d.sx)), y0 = Math.max(0, Math.floor((c.y0 - g) * d.sy));
      const x1 = Math.min(up.width, Math.ceil((c.x0 + w + g) * d.sx)), y1 = Math.min(up.height, Math.ceil((c.y0 + h + g) * d.sy));

      if (x1 - x0 < 4 || y1 - y0 < 4 || (x1 - x0) / (y1 - y0) > T.MAX_RATIO) continue;

      const todo = list.filter(i => !i.done);
      if (!todo.length) return;
      const r = await recognize(todo.map(it => ({ src: up, x: it.x0, y: it.y0, w: it.x1 - it.x0, h: it.y1 - it.y0 })));
      todo.forEach((it, i) => { it.text = r[i].text; it.conf = r[i].conf; it.num = parseNum(it.text); it.done = true; });
    };

    const finish = async hd => {
      const want = { DIM: 1, LSL: 1, USL: 1, STOCK: 1, LCL: 1, UCL: 1 };
      const xs = Object.keys(hd.hx).map(k => [k, hd.hx[k]]).sort((a, b) => a[1] - b[1]);
      const pick = items.filter(it => {
        if (it.done || it.cy < hd.hy + 0.5 * th) return false;
        let bi = 0;
        for (let i = 1; i < xs.length; i++) if (Math.abs(it.cx - xs[i][1]) < Math.abs(it.cx - xs[bi][1])) bi = i;
        const gaps = [];
        if (bi > 0) gaps.push(xs[bi][1] - xs[bi - 1][1]);

    const rest = items.filter(i => !i.done).sort((a, b) => a.cy - b.cy);   // 找不到就从上往下一段段认
    for (let s = 0; s < rest.length; s += 24) {

  // 纯几何找表：一排排字框里，连着好几排、每排好几格、行距稳定的那一大块就是表；表头在它开头几排

    const s = slopes.length ? median(slopes) : 0;

    for (let k = Math.max(0, run.a - 2); k <= Math.min(run.b, run.a + 4); k++) out.push.apply(out, lines[k].items);

  }

  // ------------------------------------------------------------------ 读表
  function hdrKey(text) {

    for (const k of ['LSL', 'USL', 'LCL', 'UCL']) if (t === k || (t.length <= 4 && t.slice(0, 3) === k)) return k;
    if (lev(t, 'STOCK') <= 1) return 'STOCK';

  // 表头：DIMENSION 带着 LSL、USL 站在同一排才算数

  function analyze(items) {

  function checkRows(rows) {
    return rows.map(r => {

      for (const k of ['DIM', 'LSL', 'USL', 'LCL', 'UCL', 'STOCK']) v[k] = r[k] && r[k].num ? r[k].num : null;
      const present = Object.keys(v).filter(k => v[k]);

      } else if (h2) {
        if (eq(v.DIM, v.USL, v.UCL) != null) set(res.ok, ['DIM', 'USL', 'UCL']); else set(res.flag, ['DIM', 'USL', 'UCL']);
      }
      for (const k of ['DIM', 'LSL', 'USL', 'LCL', 'UCL', 'STOCK']) {
        const it = r[k];
        if (!it) continue;
        if (it.edited) { delete res.flag[k]; continue; }                 // 人改过的就是真理
        if (it.num && !res.ok[k] && !res.flag[k] && it.conf < 0.9 && (k !== 'STOCK' || it.num.n !== 0)) res.flag[k] = 1;

  // ------------------------------------------------------------------ 出图
  function homography(src, dst) {

    const F = Math.max(30, Math.round(1.9 * glyph)), out = mkCanvas(c.width, c.height + F), g = ctx2d(out);
    g.drawImage(c, 0, 0);
    g.fillStyle = '#0e141c'; g.fillRect(0, c.height, out.width, F);
    const fs = Math.round(F * 0.44), y = c.height + F / 2;
    g.font = '700 ' + fs + 'px ' + FONT; g.textBaseline = 'middle'; g.textAlign = 'left';
    const red = GS.t('inch.imgRed');                 // 图底下那条：「红字 = 毫米」+ 落款，跟着界面语言
    g.fillStyle = '#ff5a5f'; g.fillText(red, fs * 0.7, y);
    const w1 = g.measureText(red).width;
    g.fillStyle = '#e5eaf1'; g.fillText(' = ' + GS.t(mode === 'in2mm' ? 'inch.mm' : 'inch.inches'), fs * 0.7 + w1, y);
    g.textAlign = 'right'; g.fillStyle = '#9aa7b8'; g.font = '600 ' + Math.round(fs * 0.9) + 'px ' + FONT;
    g.fillText(GS.t('inch.imgBrand'), out.width - fs * 0.7, y);
    return out;
  }

  function renderTable(up, A, chk, mode) {
    const rows = A.rows, lines = A.lines, th = A.th, glyph = 0.59 * th;
    const colx = (k, y) => lines[k][0] + lines[k][1] * y;
    // 1) 四个角 → 透视矫正（行列拉直）
    let H = null;
    const full = rows.filter(r => Object.keys(r).length >= 3);
    const left = ['NO', 'SYM', 'DIM'].find(k => lines[k]), right = ['UCL', 'LCL', 'STOCK', 'USL'].find(k => lines[k]);
    if (full.length >= 2 && left && right && left !== right) {
      const rowfit = r => { const ms = Object.keys(r).map(k => r[k]); const f = fit(ms.map(m => m.cx), ms.map(m => m.cy)); return [f[1], f[0]]; };
      const colfit = k => { const ms = rows.map(r => r[k]).filter(Boolean); if (ms.length >= 3) { const f = fit(ms.map(m => m.cy), ms.map(m => m.cx)); return [f[1], f[0]]; } return lines[k]; };
      const inter = (rw, cl) => { const y = (rw[0] + rw[1] * cl[0]) / (1 - rw[1] * cl[1]); return [cl[0] + cl[1] * y, y]; };
      const top = rowfit(full[0]), bot = rowfit(full[full.length - 1]), L = colfit(left), R = colfit(right);
      const TL = inter(top, L), TR = inter(top, R), BL = inter(bot, L), BR = inter(bot, R);
      const xL = (TL[0] + BL[0]) / 2, xR = (TR[0] + BR[0]) / 2, yT = (TL[1] + TR[1]) / 2, yB = (BL[1] + BR[1]) / 2;
      if (xR - xL > 4 * th && yB - yT > 2 * th) {
        H = homography([TL, TR, BL, BR], [[xL, yT], [xR, yT], [xL, yB], [xR, yB]]);
        if (H) {
          const Hi0 = inv3(H);
          const bad = !Hi0 || [TL, TR, BL, BR].some(p => { const q = applyH(H, p[0], p[1]); return !isFinite(q[0]) || !isFinite(q[1]); });
          if (bad) H = null;
        }
      }
    }
    if (!H) H = [1, 0, 0, 0, 1, 0, 0, 0, 1];
    const Hi = inv3(H);
    const mp = it => applyH(H, it.cx, it.cy);
    // 2) 矫正后的列位置、行位置
    const colX = {};
    for (const k in lines) {
      const xs = rows.map(r => r[k]).filter(Boolean).map(m => mp(m)[0]);
      colX[k] = xs.length ? median(xs) : applyH(H, colx(k, A.hy), A.hy)[0];
    }
    const rowY = rows.map(r => mean(Object.keys(r).map(k => mp(r[k])[1])));
    const hdrY0 = Math.min.apply(null, Object.keys(A.hs).map(k => applyH(H, A.hs[k].cx, A.hs[k].y0)[1]));
    const pitch = rowY.length > 1 ? median(rowY.slice(1).map((y, i) => y - rowY[i])) : A.pitch;
    const order = Object.keys(colX).sort((a, b) => colX[a] - colX[b]);
    const nb = (k, d) => { const i = order.indexOf(k) + d; return i >= 0 && i < order.length ? order[i] : null; };
    // 从标号一直裁到最右边要换的那列（有控制范围就到 UCL，没有就到上差）
    const lk = colX.NO != null ? 'NO' : colX.SYM != null ? 'SYM' : 'DIM', n1 = nb(lk, 1);
    const rk = colX.UCL != null ? 'UCL' : colX.LCL != null ? 'LCL' : 'USL', n2 = nb(rk, 1), p2 = nb(rk, -1);
    const gapL = n1 ? colX[n1] - colX[lk] : 3 * th;
    const gapR = n2 ? colX[n2] - colX[rk] : Math.max(3 * th, p2 ? colX[rk] - colX[p2] : 3 * th);
    const x0 = colX[lk] - 0.62 * gapL, x1 = colX[rk] + 0.5 * gapR;
    const SHOW = r => ['DIM', 'LSL', 'USL', 'STOCK', 'LCL', 'UCL'].filter(k => r[k] && r[k].num && colX[k] <= colX[rk] + 1 && (k !== 'STOCK' || r[k].num.n !== 0));
    const mL = 0.35 * gapL, mR = 0.3 * gapR, X0 = x0 - mL, X1 = x1 + mR;
    const yTop = hdrY0 - 0.9 * th, yBot = rowY[rowY.length - 1] + 0.75 * pitch;
    // 3) 每行原数字下面插一条，原图像素往下抻
    const cap = 1.45 * glyph, fs0 = cap / 0.72, S = Math.round(cap * 1.55);
    const cuts = [];
    rows.forEach((r, k) => {
      if (SHOW(r).length) cuts.push({ v: rowY[k] + 0.5 * glyph + 0.3 * Math.max(0, 0.5 * pitch - 0.5 * glyph), k });
    });
    const vm = [], stripAt = {}; let v = yTop;
    for (const c of cuts.concat([{ v: yBot, k: null }])) {
      const n = Math.max(0, Math.round(c.v - v));
      for (let i = 0; i < n; i++) vm.push(v + i);
      v += n;
      if (c.k != null) { stripAt[c.k] = vm.length; for (let i = 0; i < S; i++) vm.push(v); }
    }
    const Wm = Math.max(8, Math.round(X1 - X0)), Hm = vm.length;
    const sd = ctx2d(up).getImageData(0, 0, up.width, up.height).data, sw = up.width, sh = up.height;
    const warp = mkCanvas(Wm, Hm), wg = ctx2d(warp), img = wg.createImageData(Wm, Hm), od = img.data;
    for (let y = 0; y < Hm; y++) {
      const V = vm[y];
      for (let x = 0; x < Wm; x++) {
        const U = X0 + x, w = Hi[6] * U + Hi[7] * V + Hi[8];
        let fx = (Hi[0] * U + Hi[1] * V + Hi[2]) / w, fy = (Hi[3] * U + Hi[4] * V + Hi[5]) / w;
        if (!(fx > 0)) fx = 0; else if (fx > sw - 1.001) fx = sw - 1.001;
        if (!(fy > 0)) fy = 0; else if (fy > sh - 1.001) fy = sh - 1.001;
        const ix = fx | 0, iy = fy | 0, ax = fx - ix, ay = fy - iy, i00 = (iy * sw + ix) * 4, i01 = i00 + sw * 4, o = (y * Wm + x) * 4;
        for (let c = 0; c < 3; c++) {
          const p = sd[i00 + c] + (sd[i00 + 4 + c] - sd[i00 + c]) * ax, q = sd[i01 + c] + (sd[i01 + 4 + c] - sd[i01 + c]) * ax;
          od[o + c] = p + (q - p) * ay;
        }
        od[o + 3] = 255;
      }
    }
    wg.putImageData(img, 0, 0);
    // 4) 边贴到表格线上
    const dark = (xa, xb, ya, yb, vertical) => {
      const prof = [];
      if (vertical) for (let x = xa; x <= xb; x++) { let s = 0; for (let y = ya; y < yb; y += 2) { const o = (y * Wm + x) * 4; s += 765 - od[o] - od[o + 1] - od[o + 2]; } prof.push(s); }
      else for (let y = ya; y <= yb; y++) { let s = 0; for (let x = xa; x < xb; x += 2) { const o = (y * Wm + x) * 4; s += 765 - od[o] - od[o + 1] - od[o + 2]; } prof.push(s); }

    const firstRowOut = Math.max(0, Math.round(rowY[0] - yTop));
    let cL = Math.round(mL), cR = Wm - Math.round(mR), cT = 0, cB = Hm;
    let p = dark(0, Math.min(Wm - 1, Math.round(mL + 0.25 * gapL)), firstRowOut, Hm, true); if (p >= 0) cL = Math.max(0, p - 3);
    const ra = Math.max(0, Math.round(Wm - 2 * mR - 0.0)), rb = Wm - 1;
    p = dark(ra, rb, firstRowOut, Hm, true); if (p >= 0) cR = Math.min(Wm, ra + p + 4);
    const tb = Math.max(1, Math.round(hdrY0 - yTop + 0.15 * th));
    p = dark(cL, cR, 0, Math.min(Hm - 1, tb), false); if (p >= 0) cT = Math.max(0, p - 3);
    const ba = Math.max(0, Hm - Math.round(0.55 * pitch));

    const outW = Math.max(8, cR - cL), outH = Math.max(8, cB - cT);
    const c = mkCanvas(outW, outH), g = ctx2d(c);
    g.drawImage(warp, cL, cT, outW, outH, 0, 0, outW, outH);
    warp.width = warp.height = 1;
    // 5) 落红字
    const labels = [];
    const colW = k => { const a = nb(k, -1), b = nb(k, 1), ds = []; if (a) ds.push(colX[k] - colX[a]); if (b) ds.push(colX[b] - colX[k]); return ds.length ? Math.min.apply(null, ds) : 4 * th; };
    g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.lineJoin = 'round';
    rows.forEach((r, k) => {
      if (stripAt[k] == null) return;
      for (const key of SHOW(r)) {
        const it = r[key];
        const txt = convert(it.num, mode), flagged = !!chk[k].flag[key];
        let fs = fs0; g.font = '700 ' + fs + 'px ' + FONT;
        let tw = g.measureText(txt).width; const maxW = 0.9 * colW(key);
        if (tw > maxW) { fs *= maxW / tw; g.font = '700 ' + fs + 'px ' + FONT; tw = g.measureText(txt).width; }
        const u = mp(it)[0] - X0 - cL, top = stripAt[k] - cT, base = top + S / 2 + 0.36 * fs;
        const pad = 0.35 * fs;
        if (flagged) {
          g.fillStyle = '#ffd60a'; pathRound(g, u - tw / 2 - pad, top + 1, tw + 2 * pad, S - 2, 0.3 * fs); g.fill();
        } else {
          g.lineWidth = Math.max(3, fs * 0.16); g.strokeStyle = 'rgba(255,255,255,.92)'; g.strokeText(txt, u, base);
        }
        g.fillStyle = RED; g.fillText(txt, u, base);

      }

  }

  // 没认出表头：整张图里的纯数字全换，红字贴在右边
  function renderLoose(up, items, mode) {
    const nums = items.filter(i => i.num);
    const th = median(items.map(i => i.y1 - i.y0));
    let x0 = Math.min.apply(null, items.map(i => i.x0)), y0 = Math.min.apply(null, items.map(i => i.y0));
    let x1 = Math.max.apply(null, items.map(i => i.x1)), y1 = Math.max.apply(null, items.map(i => i.y1));
    x0 = Math.max(0, Math.floor(x0 - 1.5 * th)); y0 = Math.max(0, Math.floor(y0 - 1.5 * th));
    x1 = Math.min(up.width, Math.ceil(x1 + 4 * th)); y1 = Math.min(up.height, Math.ceil(y1 + 1.5 * th));
    const c = mkCanvas(x1 - x0, y1 - y0), g = ctx2d(c);
    g.drawImage(up, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
    const labels = [];
    g.textBaseline = 'alphabetic'; g.textAlign = 'left';
    for (const it of nums) {
      const glyph = 0.59 * (it.y1 - it.y0), cap = 1.15 * glyph, fs = cap / 0.72, pad = 0.3 * fs;
      const txt = convert(it.num, mode);
      g.font = '700 ' + fs + 'px ' + FONT;
      const tw = g.measureText(txt).width;
      let lx = it.x1 - x0 + 0.15 * fs, base = it.cy - y0 + cap / 2;
      if (lx + tw + 2 * pad > c.width) { lx = it.cx - x0 - tw / 2 - pad; base = it.y1 - y0 + cap + 0.4 * fs; }
      g.fillStyle = it.flag ? 'rgba(255,214,10,.95)' : 'rgba(255,255,255,.88)';
      pathRound(g, lx, base - cap - pad, tw + 2 * pad, cap + 2 * pad, 0.3 * fs); g.fill();
      g.fillStyle = RED; g.fillText(txt, lx + pad, base);
      labels.push({ x: lx, y: base - cap - pad, w: tw + 2 * pad, h: cap + 2 * pad, item: it, key: null, row: -1, flagged: !!it.flag });
    }
    return { canvas: footer(c, 0.59 * th, mode), labels };
  }

  function unitHint(items) {
    for (const it of items) {
      const t = String(it.text).replace(/\s/g, '').toLowerCase();
      if (t === 'inch' || t === 'inches' || t === '英寸' || t === 'in.') return 'in';
      if (t === 'mm' || t === '毫米') return 'mm';

  }

  async function read(img, onStep) {
    const t = {}; let t0 = performance.now();
    const lap = k => { const n = performance.now(); t[k] = Math.round(n - t0); t0 = n; };
    onStep && onStep('orient'); await nextFrame();
    const src = toCanvas(img, T.WORK); lap('decode');
    const R = await findOrientation(src); lap('orient');
    const up = rotateCanvas(src, R); src.width = src.height = 1; lap('rotate');
    onStep && onStep('read'); await nextFrame();
    const items = await readAll(up); lap('read');
    onStep && onStep('check'); await nextFrame();
    const A = analyze(items); lap('analyze');
    let kind = 'none';
    if (A && A.rows.some(r => ['DIM', 'LSL', 'USL'].some(k => r[k] && r[k].num))) kind = 'table';
    else if (items.some(i => i.num)) kind = 'loose';
    return { up, items, A: kind === 'table' ? A : null, kind, R, unit: unitHint(items), t };
  }

  function draw(job, mode) {
    if (job.kind === 'table') {
      const chk = checkRows(job.A.rows);
      const out = renderTable(job.up, job.A, chk, mode);
      const stat = { rows: job.A.rows.length, checked: chk.filter(c => c.checked).length, okRows: chk.filter(c => c.checked && !Object.keys(c.flag).length).length,
        flags: chk.reduce((s, c) => s + Object.keys(c.flag).length, 0) };
      return Object.assign(out, { chk, stat });
    }
    if (job.kind === 'loose') {
      job.items.forEach(i => { i.flag = !!i.num && !i.edited && i.conf < 0.9; });
      const out = renderLoose(job.up, job.items, mode);
      return Object.assign(out, { stat: { flags: job.items.filter(i => i.flag).length } });
    }
    return null;
  }

  return { load, read, draw, parseNum, convert, checkRows, analyze, prof, helper, get ready() { return !!(det && rec); } };
})();
</script>

<script>
/* ============================================================================
   照妖镜本体：镜框（先天八卦 + 铭文 + 慢转法阵）和从镜框里爬出来的藤蔓。

const HERO = (() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const HUE = 214;
  const hsl = (s, l, a) => a == null || a >= 1 ? 'hsl(' + HUE + ',' + s + '%,' + l + '%)' : 'hsla(' + HUE + ',' + s + '%,' + l + '%,' + a + ')';

  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  function rng(seed) {
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  // 藤：带弯度惯性的随机游走，尾巴越卷越紧
  function walk(R, o) {
    const pts = [];

    pts.push({ x, y, h });

  function tendril(G, R, x, y, h, tone, k) {        // 卷须：一根细线拧成弹簧
    const dir = R() < .5 ? 1 : -1;
    const pts = walk(R, { x, y, h, len: (26 + R() * 20) * k, k0: dir * .012, wander: .003, curlAt: .18, curl: .78, curlDir: dir });
    el('path', { d: ribbon(pts, { w0: 1.35 * k, w1: .25, pw: .55 }), fill: tone.tendril }, G.tendrils);
  }
  function grapes(G, R, x, y, tone, k) {             // 一串会发光的果子，永远往下垂
    const r0 = (2.3 + R() * 1.1) * k, rows = R() < .5 ? [3, 3, 2, 2, 1] : [2, 3, 2, 2, 1, 1];

    el('circle', { cx: f(sx), cy: f(sy + r0 * 4), r: f(r0 * 6.5), fill: tone.glow }, G.fruit);
    rows.forEach((n, i) => {
      for (let j = 0; j < n; j++) {

        const bx = sx + u * Math.cos(tilt) + v * Math.sin(tilt), by = sy - u * Math.sin(tilt) + v * Math.cos(tilt), rr = r0 * (.85 + R() * .3);
        el('circle', { cx: f(bx), cy: f(by), r: f(rr), fill: tone.berry[(i + j) % tone.berry.length] }, G.fruit);
        const tw = tone.twinkle && R() < .4;
        el('circle', { cx: f(bx - rr * .32), cy: f(by - rr * .34), r: f(rr * .32), fill: tone.shine, class: tw ? 'tw' : null,
          style: tw ? 'animation-delay:' + (-R() * 3.6).toFixed(2) + 's' : null }, G.fruit);

  // ---------------------------------------------------------------- 一根藤（带枝、叶、须、果）
  function grow(G, R, o, tone, depth) {

      }

    if (depth === 0 && G.pulse) G.pulses.push(el('path', { d: quadOpen(pts.slice(Math.round(n * .05))), class: 'pulse' }, G.pulse));
    if (o.grapes != null) { const p = pts[P(len * o.grapes)]; grapes(G, R, p.x, p.y, tone, depth ? .85 : 1); }
    if (depth === 0) for (const b of o.branches || []) {
      const i = P(len * b.at), p = pts[i], t = i / (n - 1), sd = b.side;
      grow(G, R, { x: p.x, y: p.y, h: p.h + sd * (.6 + R() * .35), len: len * b.len, w0: widthAt(o, t) * .8, w1: .3, k0: sd * .008, bias: sd * .002,
        curlAt: .58, curl: .42, curlDir: -sd, keepOut: o.keepOut, leaf0: 9, leafGap: o.leafGap * .78, leafSize: o.leafSize * .74,

  }

  const TONE = {

      tendril: hsl(36, 26), berry: [hsl(46, 38), hsl(42, 33)], shine: hsl(56, 58), glow: 'url(#gl-far)', tick: hsl(40, 40), twinkle: false },

      tendril: hsl(56, 52), berry: [hsl(80, 70), hsl(72, 63)], shine: hsl(100, 92), glow: 'url(#gl-mid)', tick: hsl(72, 72), twinkle: true },
    front: { vine: hsl(70, 64), stem: hsl(70, 64), leaf: [hsl(68, 60), hsl(76, 67), hsl(64, 56)], vein: hsl(94, 86), ghost: hsl(92, 84), ghostP: .2,
      tendril: hsl(82, 74), berry: [hsl(100, 84), hsl(92, 78)], shine: hsl(100, 97), glow: 'url(#gl-front)', tick: hsl(90, 88), twinkle: false,

  const MAIN = [
    { a: -172, layer: 'far', len: 290, w: 4.6, bias: .0062, branches: [{ at: .46, side: -1, len: .34 }], tendrils: [.58] },
    { a: -100, layer: 'far', len: 270, w: 4.4, bias: .0066, branches: [{ at: .52, side: 1, len: .3 }], tendrils: [.4] },
    { a: -28, layer: 'far', len: 300, w: 4.8, bias: .006, branches: [{ at: .4, side: 1, len: .3 }], tendrils: [.66] },
    { a: 52, layer: 'far', len: 200, w: 4.2, bias: .0085, tendrils: [.5] },
    { a: 124, layer: 'far', len: 240, w: 4.6, bias: .0075, branches: [{ at: .5, side: -1, len: .3 }], tendrils: [.36] },
    { a: -136, layer: 'mid', len: 205, w: 4.8, bias: .0038, branches: [{ at: .4, side: 1, len: .4, grapes: .92 }], tendrils: [.66], grapes: .52 },
    { a: -64, layer: 'mid', len: 215, w: 4.8, bias: .0036, branches: [{ at: .46, side: -1, len: .36 }], tendrils: [.3, .7], ticks: [.18, .5] },
    { a: 14, layer: 'mid', len: 200, w: 4.7, bias: .0045, branches: [{ at: .42, side: -1, len: .4, grapes: .9 }], tendrils: [.62] },
    { a: 162, layer: 'mid', len: 180, w: 4.5, bias: .005, branches: [{ at: .45, side: 1, len: .36 }], tendrils: [.5, .78] }
  ];

    { a: -152, h: -170, dir: -1, len: 168, w: 4.3, grapes: .58, tendrils: [.42, .8] },
    { a: -27, h: -10, dir: 1, len: 158, w: 4.1, tendrils: [.5], branches: [{ at: .52, side: -1, len: .34, grapes: .95 }] }

  function svgRoot(host) {

  }

    const m = el('mask', { id, maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: 560, height: 560 }, defs);

  }

  function buildVines(backHost, frontHost, sporeHost) {
    const R = rng(1959);                              // 1959：英寸被钉成 25.4 毫米的那年
    const back = svgRoot(backHost), bd = el('defs', {}, back);
    glowGrad(bd, 'gl-far', 50, 40, .22); glowGrad(bd, 'gl-mid', 95, 66, .3);
    const growB = growMask(bd, 'grow-b', 112);
    const far = layerGroups(back, 'url(#grow-b)'), mid = layerGroups(back, 'url(#grow-b)');
    far.pulse = null;
    for (const m of MAIN) {
      const a = m.a * Math.PI / 180, r0 = 116, isFar = m.layer === 'far';

        x: CX + Math.cos(a) * r0, y: CY + Math.sin(a) * r0, h: a + .42 + R() * .22, len: m.len, w0: m.w, w1: .32,
        k0: .006, bias: m.bias, wander: .006, curlAt: .74, curl: .36, curlDir: 1, keepOut: 152,
        leaf0: 32, leafGap: isFar ? 42 : 31, leafSize: isFar ? 18 : 21, tendrils: m.tendrils, grapes: m.grapes, branches: m.branches, ticks: m.ticks
      }, TONE[m.layer], 0);

    glowGrad(fd, 'gl-front', 100, 72, .38);

        k0: m.dir * .004, bias: m.dir * .0034, wander: .004, curlAt: .7, curl: .42, curlDir: m.dir, keepOut: 150, wIn: .08,
        leaf0: 24, leafGap: 27, leafSize: 20, tendrils: m.tendrils, grapes: m.grapes, branches: m.branches

  // ---------------------------------------------------------------- 镜框

    el('path', { d: tk[0].join(''), stroke: hsl(88, 86, .95), 'stroke-width': 1.3, 'stroke-linecap': 'round' }, spin);
    for (let k = 0; k < 4; k++) {
      const a = k * Math.PI / 2 + Math.PI / 4, c = Math.cos(a), s = Math.sin(a), r = 138.6, q = 3.4;
      const pt = (u, v) => f(r * c + u * c - v * s) + ' ' + f(r * s + u * s + v * c);
      el('path', { d: 'M' + pt(-q, 0) + 'L' + pt(0, q * .6) + 'L' + pt(q, 0) + 'L' + pt(0, -q * .6) + 'Z', fill: hsl(90, 90) }, spin);
    }
    const d = el('defs', {}, rim);
    const metal = (id, rev) => {
      const g = el('linearGradient', { id, x1: rev ? 1 : 0, y1: rev ? 1 : 0, x2: rev ? 0 : 1, y2: rev ? 0 : 1 }, d);
      [[0, 46, 84], [.28, 40, 60], [.6, 42, 30], [.8, 46, 42], [1, 56, 72]].forEach(s => el('stop', { offset: s[0], 'stop-color': hsl(s[1], s[2]) }, g));
    };
    metal('bz', false); metal('bz2', true);
    const band = el('radialGradient', { id: 'band', gradientUnits: 'userSpaceOnUse', cx: 0, cy: 0, r: 117 }, d);
    el('stop', { offset: '.8', 'stop-color': hsl(48, 9) }, band);
    el('stop', { offset: '1', 'stop-color': hsl(46, 17) }, band);
    el('circle', { r: 120.5, fill: 'none', stroke: 'url(#bz)', 'stroke-width': 7 }, rim);
    el('circle', { r: 124.1, fill: 'none', stroke: hsl(84, 90, .55), 'stroke-width': .7 }, rim);
    el('circle', { r: 106, fill: 'none', stroke: 'url(#band)', 'stroke-width': 22 }, rim);
    el('circle', { r: 116.5, fill: 'none', stroke: hsl(62, 72, .42), 'stroke-width': .6 }, rim);
    el('circle', { r: 95.5, fill: 'none', stroke: hsl(62, 72, .42), 'stroke-width': .6 }, rim);

    const TRI = ['111', '011', '010', '001', '000', '100', '101', '110'];
    TRI.forEach((code, k) => {
      const g = el('g', { transform: 'rotate(' + k * 45 + ')', fill: hsl(68, 80, .92) }, rim);

  }

  // ---------------------------------------------------------------- 动起来
  let spinEl = null, ang = 0, speed = 5, target = 5, last = 0, raf = 0, seen = true, pulses = [];
  function frame(now) {
    raf = 0;

    const dt = last ? Math.min(.05, (now - last) / 1000) : 0; last = now;

    if (!p.animate) return null;

    p.style.strokeDasharray = dash + ' ' + Math.ceil(L + 40);

      { strokeDashoffset: at(.82), opacity: .8, offset: .82 }, { strokeDashoffset: at(1), opacity: 0 }
    ], { duration: dur, iterations, delay, easing: 'linear', fill: 'both' });
  }
  function init() {
    const hero = document.getElementById('hero');
    spinEl = document.getElementById('mirror-spin');
    buildRim(spinEl, document.getElementById('mirror-rim'));
    const v = buildVines(document.getElementById('vines-back'), document.getElementById('vines-front'), document.getElementById('spores'));
    pulses = v.pulses;
    if (!reduce) {
            pulses.forEach((p, i) => { const a = flow(p, i, 2300, 1, 250 + i * 110); if (a) a.onfinish = () => a.cancel(); });
    }
    if ('IntersectionObserver' in window) new IntersectionObserver(es => { seen = es[0].isIntersecting; kick(); }).observe(hero);
    document.addEventListener('visibilitychange', kick);
    kick();
  }
  // 识别时只动「便宜」的：镜框转、镜面扫光都在显卡上合成，不跟识字抢 CPU；藤上的流光和果子闪光先停
  function setWorking(on) {
    target = on ? 70 : 5;
    kick();
  }

    const hero = document.getElementById('hero');
    hero.classList.remove('flash'); void hero.offsetWidth; hero.classList.add('flash');

})();
HERO.init();

  function setMode(m) {
    state.mode = m;
    try { localStorage.setItem(MODE_KEY, m); } catch (e) {}
    paintMode();
    if (state.job && state.job.kind !== 'none') show();
  }

  // ------------------------------------------------------------------ 状态条
  // 记下最后一句状态（key + 填空），换语言时照原样重说一遍
  let lastStatus = null;
  const setSum = text => { const sp = document.createElement('span'); sp.textContent = text; sumEl.replaceChildren(sp); };
  function status(key, pct, bad, vars) {
    lastStatus = { key, pct, bad, vars };
    statusEl.hidden = false;
    statusEl.classList.toggle('bad', !!bad);
    stText.textContent = t(key, vars && vars.whyKey ? { why: t(vars.whyKey) } : vars);
    stPct.textContent = pct == null || bad ? '' : Math.round(pct * 100) + '%';
    stBar.style.width = pct == null ? '0' : Math.round(pct * 100) + '%';
    retryEl.hidden = !bad;
  }
  const hideStatus = () => { statusEl.hidden = true; lastStatus = null; };

  // ------------------------------------------------------------------ 装引擎
  let firstTime = true, lastP = 0, shown = false;
  const loadMsg = () => state.waiting ? 'inch.loadWait' : firstTime ? 'inch.loadFirst' : 'inch.loadWarm';
  const showLoad = () => { if (shown && (!state.busy || state.waiting)) status(loadMsg(), lastP, false); };
  function boot() {
    state.engine = 'loading';
    const timer = setTimeout(() => { shown = true; showLoad(); }, 350);
    return MIRROR.load(p => { lastP = p; showLoad(); })
      .then(() => { clearTimeout(timer); state.engine = 'ready'; if (!state.busy) hideStatus(); })
      .catch(err => {
        clearTimeout(timer); state.engine = 'failed';
        console.error(err);
        status('inch.loadFail', null, true);
        throw err;
      });
  }
  (async () => {
    try {
      const c = await caches.open('inch-mirror-assets-v1');
      firstTime = !(await c.match(new URL('models/rec.onnx', location.href).href));
    } catch (e) {}
    boot().catch(() => {});
  })();
  retryEl.addEventListener('click', () => { boot().catch(() => {}); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js').catch(() => {});

  // ------------------------------------------------------------------ 拍
  const pickCam = () => { HERO.flash(); cam.value = ''; cam.click(); };
  const pickLib = () => { lib.value = ''; lib.click(); };
  shootBtn.addEventListener('click', pickCam);
  againBtn.addEventListener('click', pickCam);
  albumBtn.addEventListener('click', pickLib);
  cam.addEventListener('change', () => cam.files[0] && run(cam.files[0]));
  lib.addEventListener('change', () => lib.files[0] && run(lib.files[0]));

  const STEP = { orient: ['inch.stepOrient', 0.15], read: ['inch.stepRead', 0.45], check: ['inch.stepCheck', 0.85], draw: ['inch.stepDraw', 0.95] };
  const paintFace = () => { $('face-label').textContent = t(state.busy ? 'inch.faceBusy' : 'inch.faceIdle'); };
  paintFace();
  function setBusy(b) {
    state.busy = b;
    [shootBtn, albumBtn, againBtn].forEach(x => { x.disabled = b; });
    $('hero').classList.toggle('working', b);       // 镜子转快、镜面扫光、藤上跑光
    paintFace();
    HERO.setWorking(b);
  }
  // 用 onload 等图：img.decode() 在页面切到后台时可能永远不回话
  function loadImage(file) {
    const url = URL.createObjectURL(file), img = new Image();
    return new Promise((resolve, reject) => {
      const done = ok => { img.onload = img.onerror = null; setTimeout(() => URL.revokeObjectURL(url), 60000); ok ? resolve(img) : reject(new Error('decode')); };
      img.onload = () => done(true);
      img.onerror = () => done(false);
      img.src = url;
    });
  }
  async function run(file) {
    if (state.busy) return;
    setBusy(true);
    hintEl.hidden = true;
    try {
      if (state.engine !== 'ready') {
        state.waiting = true; shown = true; showLoad();
        try { if (state.engine === 'failed') await boot(); else await MIRROR.load(); } finally { state.waiting = false; }
      }
      let img;
      try { img = await loadImage(file); } catch (e) { const x = new Error('decode'); x.why = 'inch.badImage'; throw x; }
      const job = await MIRROR.read(img, k => status(STEP[k][0], STEP[k][1], false));
      state.job = job;
      window.__inch.timings = job.t;
      status(STEP.draw[0], STEP.draw[1], false);
      await new Promise(r => setTimeout(r, 0));
      await show(true);
      hideStatus();
    } catch (err) {
      console.error(err);
      // 说得出原因的说一句人话；说不出的不把报错原文甩给人看（原文在控制台）
      if (err && err.why) status('inch.failWhy', null, true, { whyKey: err.why });
      else status('inch.fail', null, true);
      retryEl.hidden = true;
    } finally {
      setBusy(false);
    }
  }

  // ------------------------------------------------------------------ 出结果
  async function show(scroll) {
    const job = state.job;
    resultEl.hidden = false;
    unitEl.hidden = true;
    if (!job || job.kind === 'none') {
      sumEl.className = 'sum none';
      setSum(t('inch.none'));
      pic.parentElement.hidden = true; saveBtn.hidden = true;
      state.out = null;
      window.__inch.result = { kind: 'none' };
      return;
    }
    const t0 = performance.now();
    const out = MIRROR.draw(job, state.mode);
    state.out = out;
    pic.parentElement.hidden = false; saveBtn.hidden = false;
    const blob = await new Promise(r => out.canvas.toBlob(r, 'image/jpeg', 0.92));
    if (state.url) URL.revokeObjectURL(state.url);
    state.url = URL.createObjectURL(blob);
    state.blob = blob;
    await new Promise(res => { pic.onload = res; pic.onerror = res; pic.src = state.url; });
    const st = out.stat, red = t('inch.redIs', { unit: UNIT() });
    let text, cls = 'sum';
    if (job.kind === 'table') {
      if (st.flags) { text = red + ' · ' + t(st.flags === 1 ? 'inch.flagsOne' : 'inch.flagsMany', { n: st.flags }); cls += ' flag'; }
      else if (st.checked) text = red + ' · ' + t(st.okRows === 1 ? 'inch.checkedOne' : 'inch.checkedMany', { n: st.okRows });
      else text = red + ' · ' + t('inch.tapToFix');
    } else {
      text = t('inch.loose') + ' · ' + red;
      if (st.flags) { text += ' · ' + t('inch.looseFlags'); cls += ' flag'; }
    }
    sumEl.className = cls; setSum(text);
    $('turn').hidden = out.canvas.width <= 1200;     // 图宽了（带控制范围），竖屏看字小，提醒一句
    const want = state.mode === 'in2mm' ? 'in' : 'mm';
    if (job.unit && job.unit !== want) {
      unitText.textContent = t('inch.unitWrong', { unit: t(job.unit === 'in' ? 'inch.inches' : 'inch.mm') });
      unitEl.hidden = false;
    }
    window.__inch.timings.draw = Math.round(performance.now() - t0);
    window.__inch.result = summarize();
    if (scroll) resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  $('unit-fix').addEventListener('click', () => setMode(state.mode === 'in2mm' ? 'mm2in' : 'in2mm'));

  function summarize() {
    const job = state.job, out = state.out;
    if (job.kind === 'table') {
      return { kind: 'table', mode: state.mode, stat: out.stat, rows: job.A.rows.map((r, i) => {
        const o = { no: r.NO ? r.NO.text : null };
        for (const k of ['DIM', 'LSL', 'USL', 'LCL', 'UCL']) if (r[k]) o[k] = r[k].text;
        o.conv = {}; for (const k of ['DIM', 'LSL', 'USL', 'LCL', 'UCL']) if (r[k] && r[k].num) o.conv[k] = MIRROR.convert(r[k].num, state.mode);
        o.flag = Object.keys(out.chk[i].flag); o.ok = Object.keys(out.chk[i].ok); o.sugg = out.chk[i].sugg;
        return o;
      }), size: [out.canvas.width, out.canvas.height], labels: out.labels.length };
    }
    return { kind: job.kind, mode: state.mode, nums: job.items.filter(i => i.num).map(i => [i.text, MIRROR.convert(i.num, state.mode)]), labels: out.labels.length };
  }

  // ------------------------------------------------------------------ 存图
  saveBtn.addEventListener('click', async () => {
    if (!state.blob) return;
    const d = new Date(), p = n => String(n).padStart(2, '0');
    const name = t('inch.fileName') + '-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '.jpg';
    const file = new File([state.blob], name, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = state.url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  });

  // ------------------------------------------------------------------ 点红字改数
  pic.addEventListener('click', e => {
    if (!state.out) return;
    const r = pic.getBoundingClientRect(), k = state.out.canvas.width / r.width;
    const x = (e.clientX - r.left) * k, y = (e.clientY - r.top) * k, pad = 10 * k;
    let hit = null, hd = Infinity;
    for (const L of state.out.labels) {
      if (x < L.x - pad || x > L.x + L.w + pad || y < L.y - pad || y > L.y + L.h + pad) continue;
      const d = Math.abs(x - (L.x + L.w / 2)) + Math.abs(y - (L.y + L.h / 2));
      if (d < hd) { hd = d; hit = L; }
    }
    if (hit) openEdit(hit);
  });
  // 单子上的字（换语言时单子开着也跟着换）
  function paintEdit() {
    const L = state.editing;
    if (!L) return;
    const job = state.job, it = L.item, row = L.row >= 0 ? job.A.rows[L.row] : null;
    edMeta.textContent = (row && row.NO && row.NO.text ? t('inch.edRow', { no: row.NO.text }) + ' · ' : '') +
      (L.key ? t('inch.names')[L.key] : t('inch.edLoose')) + ' · ' + t('inch.edReadAs', { text: it.text });
    const sug = row ? state.out.chk[L.row].sugg[L.key] : null;
    edSug.hidden = !sug;
    if (sug) {
      edSugText.innerHTML = '';
      edSugText.append(t(L.key === 'LCL' || L.key === 'UCL' ? 'inch.sugCalc' : 'inch.sugBack'));
      const b = document.createElement('b'); b.textContent = sug; edSugText.append(b); edSug.dataset.v = sug;
    }
    preview();
  }
  function openEdit(L) {
    const it = L.item;
    state.editing = L;
    edNum.value = it.num ? it.num.s : it.text;
    paintEdit();
    veil.hidden = false;
    fitSheet();
    edNum.focus();                                   // 必须在点击当下聚焦，iPhone 才肯弹键盘
    try { edNum.setSelectionRange(0, edNum.value.length); } catch (x) {}
  }
  // 键盘弹起来时，单子跟着顶到键盘上面
  function fitSheet() {
    const vv = window.visualViewport;
    if (veil.hidden || !vv) return;
    veil.style.top = vv.offsetTop + 'px';
    veil.style.bottom = Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px';
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', fitSheet);
    window.visualViewport.addEventListener('scroll', fitSheet);
  }
  function preview() {
    const p = MIRROR.parseNum(edNum.value);
    edNum.setAttribute('aria-invalid', String(!p && edNum.value.trim() !== ''));
    edPrev.innerHTML = '';
    if (p) { const b = document.createElement('b'); b.textContent = MIRROR.convert(p, state.mode); edPrev.append('= ', b, UNIT()); }
    else edPrev.textContent = t('inch.numHint');
    $('ed-ok').disabled = !p;
  }
  edNum.addEventListener('input', preview);
  edNum.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
  $('ed-sign').addEventListener('click', () => {
    const v = edNum.value.trim();
    edNum.value = v.charAt(0) === '-' ? v.slice(1) : v.charAt(0) === '+' ? '-' + v.slice(1) : '-' + v;
    preview();
  });
  $('ed-sug-use').addEventListener('click', () => { edNum.value = edSug.dataset.v; preview(); });
  const closeEdit = () => { edNum.blur(); veil.hidden = true; veil.style.top = veil.style.bottom = ''; state.editing = null; };
  $('ed-cancel').addEventListener('click', closeEdit);
  veil.addEventListener('click', e => { if (e.target === veil) closeEdit(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !veil.hidden) closeEdit(); });
  $('ed-ok').addEventListener('click', commit);
  function commit() {
    const L = state.editing, p = MIRROR.parseNum(edNum.value);
    if (!L || !p) return;
    L.item.num = p; L.item.text = edNum.value.trim(); L.item.edited = true; L.item.conf = 1;
    closeEdit();
    show(false);
  }
  // 右上角换了语言：状态条、镜面、结果那句和图底下的落款、开着的改数单子都照新语言重来一遍
  window.addEventListener('gs:lang', () => {
    paintFace();
    if (lastStatus && !statusEl.hidden) status(lastStatus.key, lastStatus.pct, lastStatus.bad, lastStatus.vars);
    if (lastStatus && lastStatus.bad) retryEl.hidden = lastStatus.key !== 'inch.loadFail';
    if (state.job && !resultEl.hidden) show(false).then(paintEdit);
    else paintEdit();
  });
  window.__inch.run = run;
  window.__inch.openEdit = i => state.out && openEdit(state.out.labels[i]);
})();
</script>
</body>
</html>
